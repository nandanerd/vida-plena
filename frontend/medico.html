
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Vida Plena - Painel Médico</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --primary: #153650;
    --secondary: #205b78;
    --accent: #269e91;
    --background: #f1f5f9;
    --text: #263b4c;
    --muted: #718096;
    --border: #e2e8f0;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 20px;
    background: var(--background);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* CABEÇALHO */

.topbar {
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.topbar-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.topbar-info strong {
    font-size: 15px;
    color: var(--primary);
}

.topbar-info span {
    font-size: 12px;
    color: var(--muted);
}

/* BOTÃO SAIR */

.btn-sair {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;

    background: #fff;
    color: #c0392b;

    border: 1px solid #f0d4d1;
    border-radius: 8px;

    font-size: 13px;
    font-weight: 700;
    text-decoration: none;

    transition: .25s;
}

.btn-sair:hover {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
    transform: translateY(-2px);
}

/* CONTAINER */

.container {
    max-width: 1200px;
    width: 100%;
    margin: auto;
    padding: 35px;

    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;

    box-shadow: 0 8px 30px rgba(25, 48, 70, .06);
}

/* IDENTIDADE VISUAL */

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo-img {
    width: 95px;
    height: 95px;
    object-fit: contain;
    margin-bottom: 12px;
}

.header h1 {
    color: var(--primary);
    font-size: 27px;
    margin: 0;
    font-weight: 750;
}

.header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
}

/* TÍTULOS */

.section-title {
    color: var(--primary);
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 22px;
}

.section-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: -15px;
    margin-bottom: 22px;
}

/* PACIENTES */

#pacientes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
    margin-bottom: 35px;
}

/* CARTÕES */

.card {
    background: #fbfdff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 11px;

    padding: 22px;
    min-width: 0;

    transition: .25s;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 22px rgba(27, 65, 88, .09);
    border-color: #cbdce5;
}

.card h2 {
    font-size: 18px;
    color: var(--primary);
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.card p {
    font-size: 13px;
    color: #647789;
    line-height: 1.6;
    margin: 6px 0;
    overflow-wrap: anywhere;
}

.card p b {
    color: #29475c;
}

.card h3 {
    color: var(--secondary);
    font-size: 13px;
    margin: 17px 0 6px;
}

/* BOTÃO ATENDER */

.card button {
    width: 100%;
    height: 43px;
    margin-top: 20px;

    background: var(--secondary);
    color: white;

    border: none;
    border-radius: 7px;

    font-weight: 700;
    font-size: 13px;
    cursor: pointer;

    transition: .25s;
}

.card button:hover {
    background: var(--primary);
    transform: translateY(-2px);
}

/* DIVISÓRIA */

hr {
    border: none;
    height: 1px;
    background: var(--border);
    margin: 35px 0;
}

/* CONSULTA */

.consulta-header {
    margin-bottom: 25px;
}

.consulta-header h2 {
    color: var(--primary);
    font-size: 21px;
    margin: 0 0 8px;
}

.consulta-header p {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
}

/* CAMPOS */

.container > input,
.container > select,
.container > textarea {
    display: block;
    width: 100%;
    height: 48px;

    padding: 0 15px;
    margin-bottom: 16px;

    background: #f8fafc;
    border: 1px solid #dce5ec;
    border-radius: 8px;

    font-family: inherit;
    font-size: 14px;
    color: var(--text);

    outline: none;
    transition: .25s;
}

.container > textarea {
    height: 120px;
    padding: 14px 15px;
    resize: vertical;
}

.container input:focus,
.container select:focus,
.container textarea:focus {
    background: white;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(38, 158, 145, .12);
}

.container input::placeholder,
.container textarea::placeholder {
    color: #9aaab5;
}

/* BOTÃO SALVAR */

.btn-salvar {
    width: 100%;
    min-height: 49px;

    background: var(--accent);
    color: white;

    border: none;
    border-radius: 8px;

    font-size: 14px;
    font-weight: 700;
    cursor: pointer;

    transition: .25s;
}

.btn-salvar:hover {
    background: #197e74;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(38, 158, 145, .2);
}

/* RESPONSIVIDADE */

@media (max-width: 700px) {

    body {
        padding: 15px 10px;
    }

    .container {
        padding: 23px 17px;
    }

    .topbar {
        margin-bottom: 15px;
    }

    .header h1 {
        font-size: 23px;
    }

    .logo-img {
        width: 75px;
        height: 75px;
    }

    #pacientes {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 19px;
    }

}

</style>
</head>

<body>

<!-- CABEÇALHO SUPERIOR -->

<div class="topbar">

    <div class="topbar-info">
        <strong>HOSPITAL VIDA PLENA</strong>
        <span>Sistema de Gestão Hospitalar</span>
    </div>

    <a href="index.html" class="btn-sair">
        ← Sair
    </a>

</div>


<div class="container">

    <!-- IDENTIDADE -->

    <div class="header">

        <img
            src="Logo Hospitalar Vida Plena.png"
            class="logo-img"
            alt="Logo Hospital Vida Plena"
        >

        <h1>Painel Médico</h1>

        <p>Gerenciamento de pacientes e consultas médicas</p>

    </div>


    <!-- LISTA DE PACIENTES -->

    <h2 class="section-title">Pacientes aguardando atendimento</h2>

    <p class="section-subtitle">
        Selecione um paciente para iniciar o atendimento.
    </p>

    <div id="pacientes">
        <!-- Os pacientes serão carregados aqui -->
    </div>


    <hr>


    <!-- CONSULTA MÉDICA -->

    <div class="consulta-header">

        <h2>Consulta Médica</h2>

        <p>
            Preencha as informações abaixo para registrar o atendimento.
        </p>

    </div>


    <input
        id="paciente"
        type="text"
        placeholder="Nome do paciente"
    >

    <input
        id="diagnostico"
        type="text"
        placeholder="Diagnóstico"
    >

    <select id="medicacao">

        <option value="">Selecione a medicação</option>

        <option>Dipirona</option>
        <option>Paracetamol</option>
        <option>Amoxicilina</option>
        <option>Ibuprofeno</option>
        <option>Outro</option>

    </select>


    <textarea
        id="obs"
        placeholder="Observações médicas..."
    ></textarea>


    <button class="btn-salvar" onclick="salvar()">
        Salvar Consulta
    </button>

</div>


<script>

let pacientes = [];


function carregarPacientes() {

    fetch("/pacientes-medico")

    .then(res => res.json())

    .then(data => {

        pacientes = data;

        const div = document.getElementById("pacientes");

        div.innerHTML = "";


        data.forEach((p, index) => {

            div.innerHTML += `

                <div class="card">

                    <h2>${p.nome}</h2>

                    <p>
                        <b>CPF:</b> ${p.cpf}
                    </p>

                    <p>
                        <b>Tipo:</b> ${p.tipo}
                    </p>

                    <h3>🩺 Sintomas</h3>

                    <p>
                        ${
                            Array.isArray(p.sintomas)
                            ? p.sintomas.join(", ")
                            : p.sintomas || "Não informado"
                        }
                    </p>

                    <h3>🌡 Temperatura</h3>

                    <p>
                        ${p.temperatura || "Não informado"} °C
                    </p>

                    <h3>🚨 Risco</h3>

                    <p>
                        ${p.risco || "Não classificado"}
                    </p>

                    <h3>⚠️ Alergia</h3>

                    <p>
                        ${p.alergia || "Nenhuma"}
                    </p>

                    <h3>📝 Observação da triagem</h3>

                    <p>
                        ${p.observacao || "Nenhuma"}
                    </p>

                    <button onclick="selecionar(${index})">
                        Atender paciente
                    </button>

                </div>

            `;

        });

    })

    .catch(error => {
        console.error("Erro ao carregar pacientes:", error);
    });

}


function selecionar(index) {

    let p = pacientes[index];

    document.getElementById("paciente").value = p.nome;

    document.getElementById("diagnostico").focus();

}


function salvar() {

    fetch("/consulta", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            paciente:
                document.getElementById("paciente").value,

            diagnostico:
                document.getElementById("diagnostico").value,

            medicacao:
                document.getElementById("medicacao").value,

            obs:
                document.getElementById("obs").value

        })

    })

    .then(res => {

        if (!res.ok) {
            throw new Error("Erro ao salvar consulta");
        }

        alert("Consulta salva com sucesso!");

        document.getElementById("diagnostico").value = "";
        document.getElementById("medicacao").value = "";
        document.getElementById("obs").value = "";
        document.getElementById("paciente").value = "";

        carregarPacientes();

    })

    .catch(error => {

        console.error(error);

        alert("Não foi possível salvar a consulta.");

    });

}


carregarPacientes();

</script>

</body>
</html>
