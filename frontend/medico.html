<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<title>Hospital Vida Plena - Médico</title>

<style>
    

<style>

/* =====================================================
   HOSPITAL VIDA PLENA
   PAINEL MÉDICO - DESIGN PROFISSIONAL
===================================================== */

/* PADRÃO DE DIMENSIONAMENTO */

body:has(.logo-img),
body:has(.logo-img) *,
body:has(.logo-img) *::before,
body:has(.logo-img) *::after {
    box-sizing: border-box;
}

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

body:has(.logo-img) {
    --med-primary: #142f49;
    --med-secondary: #205b78;
    --med-accent: #269e91;
    --med-bg: #edf2f6;
    --med-text: #263b4c;
    --med-muted: #788b99;
    --med-border: #dce5ec;

    margin: 0;
    min-height: 100vh;
    padding: 40px 20px;
    background: var(--med-bg);
    color: var(--med-text);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* =====================================================
   CONTAINER PRINCIPAL
===================================================== */

body:has(.logo-img) .container {
    width: 100%;
    max-width: 1150px;
    margin: 0 auto;
    padding: 38px;

    background: #ffffff;
    border: 1px solid var(--med-border);
    border-radius: 15px;

    box-shadow: 0 10px 35px rgba(25, 48, 70, 0.07);
}

/* =====================================================
   LOGO
===================================================== */

body:has(.logo-img) .logo-img {
    display: block;
    width: 95px;
    height: 95px;
    object-fit: contain;
    margin: 0 auto 15px;
}

/* =====================================================
   TÍTULOS
===================================================== */

body:has(.logo-img) h2 {
    color: var(--med-primary);
    font-size: 24px;
    font-weight: 750;
    margin: 0 0 22px;
}

body:has(.logo-img) .container > h2:first-of-type {
    text-align: center;
    font-size: 28px;
    margin-bottom: 35px;
}

body:has(.logo-img) h3 {
    color: var(--med-secondary);
    font-size: 14px;
    font-weight: 700;
    margin: 19px 0 7px;
}

/* =====================================================
   ÁREA DOS PACIENTES
===================================================== */

#pacientes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 18px;
    margin: 20px 0 35px;
    min-width: 0;
}

/* =====================================================
   CARTÃO DE PACIENTE
===================================================== */

body:has(.logo-img) .card {
    position: relative;
    min-width: 0;
    padding: 23px;

    background: #f9fbfc;
    border: 1px solid #e0e8ed;
    border-left: 4px solid #269e91;
    border-radius: 10px;

    transition: 0.25s ease;
}

body:has(.logo-img) .card:hover {
    background: #ffffff;
    border-color: #cbdce5;
    border-left-color: #205b78;
    box-shadow: 0 8px 22px rgba(27, 65, 88, 0.08);
    transform: translateY(-3px);
}

body:has(.logo-img) .card h2 {
    font-size: 19px;
    margin: 0 0 16px;
    padding-bottom: 13px;
    border-bottom: 1px solid #e5ebef;
}

body:has(.logo-img) .card p {
    color: #607483;
    font-size: 13px;
    line-height: 1.6;
    margin: 5px 0;
    overflow-wrap: anywhere;
}

body:has(.logo-img) .card p b {
    color: #29475c;
}

/* TÍTULOS DAS INFORMAÇÕES CLÍNICAS */

body:has(.logo-img) .card h3 {
    padding-top: 5px;
    margin-top: 14px;
    color: #205b78;
    font-size: 13px;
}

/* =====================================================
   BOTÃO ATENDER
===================================================== */

body:has(.logo-img) .card button {
    width: 100%;
    height: 43px;
    margin-top: 20px;

    background: #205b78;
    color: #ffffff;
    border: none;
    border-radius: 7px;

    font-size: 13px;
    font-weight: 700;
    cursor: pointer;

    transition: 0.25s;
}

body:has(.logo-img) .card button:hover {
    background: #142f49;
    box-shadow: 0 5px 13px rgba(20, 47, 73, 0.15);
}

/* =====================================================
   DIVISÓRIA
===================================================== */

body:has(.logo-img) hr {
    border: none;
    height: 1px;
    background: #e3eaf0;
    margin: 35px 0;
}

/* =====================================================
   CONSULTA MÉDICA
===================================================== */

body:has(.logo-img) .container > h2:last-of-type {
    padding-bottom: 16px;
    border-bottom: 1px solid #e7edf1;
}

/* =====================================================
   CAMPOS
===================================================== */

body:has(.logo-img) .container > input,
body:has(.logo-img) .container > select,
body:has(.logo-img) .container > textarea {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 49px;
    padding: 0 15px;
    margin-bottom: 16px;

    background: #f8fafb;
    border: 1px solid #dce5ec;
    border-radius: 7px;

    color: #294252;
    font-family: inherit;
    font-size: 14px;

    outline: none;
    transition: 0.25s;
}

body:has(.logo-img) .container > textarea {
    height: 115px;
    padding: 14px 15px;
    resize: vertical;
}

body:has(.logo-img) .container > input::placeholder,
body:has(.logo-img) .container > textarea::placeholder {
    color: #9aaab5;
}

body:has(.logo-img) .container > input:focus,
body:has(.logo-img) .container > select:focus,
body:has(.logo-img) .container > textarea:focus {
    background: #ffffff;
    border-color: #269e91;
    box-shadow: 0 0 0 3px rgba(38, 158, 145, 0.10);
}

/* =====================================================
   BOTÃO SALVAR CONSULTA
===================================================== */

body:has(.logo-img) .container > button {
    width: 100%;
    min-height: 49px;

    background: #269e91;
    color: #ffffff;
    border: none;
    border-radius: 7px;

    font-size: 14px;
    font-weight: 700;
    cursor: pointer;

    transition: 0.25s;
}

body:has(.logo-img) .container > button:hover {
    background: #197e74;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(38, 158, 145, 0.18);
}

/* =====================================================
   RESPONSIVIDADE
===================================================== */

@media (max-width: 700px) {

    body:has(.logo-img) {
        padding: 18px 12px;
    }

    body:has(.logo-img) .container {
        padding: 23px 17px;
    }

    body:has(.logo-img) .container > h2:first-of-type {
        font-size: 23px;
    }

    #pacientes {
        grid-template-columns: 1fr;
    }

    body:has(.logo-img) .card {
        padding: 19px;
    }

    body:has(.logo-img) .logo-img {
        width: 75px;
        height: 75px;
    }
}

</style>


</style>

</head>


<body>


<div class="container">


<img src="Logo Hospitalar Vida Plena.png" class="logo-img">


<h2>Painel Médico</h2>


<div id="pacientes">


<!-- OS DADOS VÃO APARECER AQUI -->

</div>



<hr>


<h2>Consulta Médica</h2>


<input
    id="paciente"
    type="text"
    placeholder="Digite o nome do paciente"
>


<input id="diagnostico" placeholder="Diagnóstico">


<select id="medicacao">

<option value="">Selecione a medicação</option>

<option>Dipirona</option>

<option>Paracetamol</option>

<option>Amoxicilina</option>

<option>Ibuprofeno</option>

<option>Outro</option>


</select>


<textarea id="obs" placeholder="Observações"></textarea>


<button onclick="salvar()">
Salvar Consulta
</button>



</div>





<script>


let pacientes=[];



function carregarPacientes(){


fetch("/pacientes-medico")


.then(res=>res.json())


.then(data=>{


pacientes=data;


const div=document.getElementById("pacientes");


div.innerHTML="";



data.forEach((p,index)=>{


div.innerHTML += `


<div class="card">


<h2>
${p.nome}
</h2>



<p>

<b>CPF:</b>

${p.cpf}

</p>



<p>

<b>Tipo:</b>

${p.tipo}

</p>




<h3>
🩺 Sintomas
</h3>


<p id="sintomas">

${
Array.isArray(p.sintomas)

?
p.sintomas.join(", ")

:
p.sintomas || "Não informado"

}

</p>




<h3>
🌡 Temperatura
</h3>


<p>

${p.temperatura || "Não informado"}

°C

</p>





<h3>
🚨 Risco
</h3>


<p>

${p.risco || "Não classificado"}

</p>





<h3>
⚠️ Alergia
</h3>


<p>

${p.alergia || "Nenhuma"}

</p>





<h3>
📝 Observação da triagem
</h3>


<p>

${p.observacao || "Nenhuma"}

</p>




<button onclick="selecionar(${index})">

Atender

</button>



</div>



`;



});


});


}




function selecionar(index){


let p=pacientes[index];


document.getElementById("paciente").value=p.nome;


}




function salvar(){



fetch("/consulta",{


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({


paciente:
document.getElementById("paciente").value,


diagnostico:
document.getElementById("diagnostico").value,


medicacao:
document.getElementById("medicacao").value,


obs:
document.getElementById("obs").value


})


})


.then(()=>{


alert("Consulta salva");


carregarPacientes();


});

}
carregarPacientes();


</script>
</body>
</html>
