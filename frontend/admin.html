<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Cadastro Simples</title>
    <link rel="stylesheet" href="/frontend/css/admin.css">
</head>
<body>
    <div class="container">
        <a href="index.html" style="text-decoration: none; color: #3498db; 
        font-size: 14px; display: inline-block; margin-bottom: 12px;"> Volte para o login</a>
        <button type="button" class="btn-almoxarifadoo" onclick="window.location.href='almoxarifado.html'">Acessar Almoxarifado</button>
        <h2> Cadastrar Usuário</h2>

        <form id="formUsuario">
            <input type="text" id="usuario" placeholder="Nome de Usuário (Login)" required>
            <input type="password" id="senha" placeholder="Senha" required>


            <select id="tipo" required>
                <option value="">Selecione o Setor</option>
                <option value="atendimento">Atendimento</option>
                <option value="triagem">Triagem</option>
                <option value="medico">Médico</option>
            </select>

            <button type="submit">Cadastrar Usuário</button>
        </form>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ccc;">

        <h3> Usuário Cadastrados</h3>
        <div id="listaUsuarios"></div>
    </div>

    <script>

    // Cadastrar usuário
    document.getElementById("formUsuario").addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();
        const senha = document.getElementById("senha").value;
        const tipo = document.getElementById("tipo").value;

        try {
            const resposta = await fetch("http://localhost:3000/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, senha, tipo })
            });

            const dados = await resposta.json();

            if (!resposta.ok || dados.erro) {
                alert("Erro ao cadastrar: " + (dados.erro || "Verifique os dados."));
                return;
            }

            alert("Usuário cadastrado com sucesso!");
            document.getElementById("formUsuario").reset();
            carregarUsuarios();

        } catch (erro) {
            console.error("Erro:", erro);
            alert("Não foi possível conectar ao servidor. Verifique se ele está funcionando.");
        }
    });

    // Listar usuários cadastrados
    async function carregarUsuarios() {
        const div = document.getElementById("listaUsuarios");

        try {
            const resposta = await fetch("http://localhost:3000/usuarios");

            if (!resposta.ok) {
                throw new Error("Erro ao buscar usuários.");
            }

            const usuarios = await resposta.json();
            div.innerHTML = "";

            usuarios.forEach(u => {
                const card = document.createElement("div");
                card.className = "card";

                const nome = document.createElement("b");
                nome.textContent = "Usuário: ";
                card.appendChild(nome);
                card.appendChild(document.createTextNode(u.usuario + " | "));

                const setor = document.createElement("b");
                setor.textContent = "Setor: ";
                card.appendChild(setor);
                card.appendChild(document.createTextNode(u.tipo));

                div.appendChild(card);
            });

        } catch (erro) {
            console.error("Erro ao listar usuários:", erro);
            div.textContent = "Não foi possível carregar os usuários.";
        }
    }

    // Carregar a lista ao abrir a página
    carregarUsuarios();
</script>

</body>
