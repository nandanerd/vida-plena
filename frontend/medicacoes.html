
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123d50">
    <title>Medicações | Hospital Vida Plena</title>
    <style>
        
/* =====================================================
   HOSPITAL VIDA PLENA
   SETOR DE MEDICAÇÕES
   IDENTIDADE VISUAL INSTITUCIONAL PREMIUM
===================================================== */

:root {
    --primary: #123d50;
    --primary-dark: #0b2939;
    --primary-light: #1b6073;

    --accent: #32ad9d;
    --accent-light: #e8f7f4;

    --background: #f3f6f9;
    --surface: #ffffff;

    --text: #243b4a;
    --text-secondary: #718392;
    --muted: #98a7b1;

    --border: #e4ebf0;

    --success: #20866f;
    --danger: #c34b4b;

    --shadow:
        0 8px 30px rgba(24, 54, 72, 0.055);

    --radius: 12px;
}

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body.medicacoes-page {
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

/* =====================================================
   CABEÇALHO
===================================================== */

.setor-header {
    width: 100%;
    min-height: 88px;

    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: var(--surface);

    border-bottom: 1px solid var(--border);

    box-shadow:
        0 3px 15px rgba(20, 50, 70, 0.035);
}

.setor-brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.setor-logo {
    width: 49px;
    height: 49px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background: linear-gradient(
        145deg,
        var(--primary),
        var(--primary-light)
    );

    color: #ffffff;

    font-size: 17px;
    font-weight: 850;
    letter-spacing: -1px;

    box-shadow:
        0 5px 13px rgba(18, 61, 80, 0.18);
}

.setor-brand h1 {
    color: var(--primary);

    font-size: 19px;
    font-weight: 750;

    letter-spacing: -0.4px;
}

.setor-brand p {
    margin-top: 4px;

    color: var(--text-secondary);

    font-size: 12px;
    font-weight: 500;
}

/* =====================================================
   BOTÃO SAIR
===================================================== */

.btn-sair {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 40px;
    padding: 0 17px;

    border: 1px solid #e5ebef;
    border-radius: 7px;

    background: #ffffff;

    color: #627482;

    font-size: 12px;
    font-weight: 700;

    text-decoration: none;

    transition: all 0.25s ease;
}

.btn-sair:hover {
    background: #fff2f1;

    border-color: #f1d1ce;

    color: var(--danger);

    transform: translateY(-1px);
}

/* =====================================================
   CONTEÚDO PRINCIPAL
===================================================== */

.setor-container {
    width: 100%;
    max-width: 1180px;

    margin: 0 auto;

    padding: 48px 28px 70px;
}

/* =====================================================
   APRESENTAÇÃO DO SETOR
===================================================== */

.setor-welcome {
    margin-bottom: 32px;
}

.setor-tag {
    display: inline-flex;
    align-items: center;

    padding: 7px 12px;

    margin-bottom: 15px;

    border-radius: 5px;

    background: var(--accent-light);

    color: #238b7c;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 1.1px;
}

.setor-welcome h2 {
    color: var(--primary);

    font-size: 29px;
    font-weight: 750;

    letter-spacing: -0.8px;
}

.setor-welcome p {
    margin-top: 10px;

    max-width: 650px;

    color: var(--text-secondary);

    font-size: 14px;
    line-height: 1.7;
}

/* =====================================================
   CARTÃO PRINCIPAL
===================================================== */

.setor-card {
    padding: 32px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow: var(--shadow);
}

/* =====================================================
   CABEÇALHO DO HISTÓRICO
===================================================== */

.setor-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    padding-bottom: 24px;

    border-bottom: 1px solid var(--border);
}

.setor-section-header h2 {
    color: var(--primary);

    font-size: 18px;
    font-weight: 750;

    letter-spacing: -0.3px;
}

.setor-section-header p {
    margin-top: 7px;

    color: var(--text-secondary);

    font-size: 12px;
}

/* =====================================================
   BOTÃO ATUALIZAR
===================================================== */

.btn-secondary {
    min-height: 41px;

    padding: 0 19px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 7px;

    background: var(--primary);

    color: #ffffff;

    font-family: inherit;
    font-size: 12px;
    font-weight: 700;

    cursor: pointer;

    transition: all 0.25s ease;
}

.btn-secondary:hover {
    background: var(--primary-light);

    box-shadow:
        0 5px 13px rgba(18, 61, 80, 0.15);

    transform: translateY(-2px);
}

.btn-secondary:active {
    transform: translateY(0);
}

/* =====================================================
   RESUMO DE PRESCRIÇÕES
===================================================== */

.medicacoes-resumo {
    display: flex;
    gap: 18px;

    margin: 25px 0;
}

.medicacoes-resumo-item {
    position: relative;

    min-width: 235px;

    padding: 21px 24px;

    overflow: hidden;

    background:
        linear-gradient(
            120deg,
            #123d50,
            #1b6073
        );

    border-radius: 10px;

    box-shadow:
        0 7px 19px rgba(18, 61, 80, 0.12);
}

.medicacoes-resumo-item::after {
    content: "";

    position: absolute;

    width: 110px;
    height: 110px;

    right: -28px;
    top: -36px;

    border-radius: 50%;

    background: rgba(255,255,255,0.07);
}

.medicacoes-resumo-item span {
    display: block;

    color: #c4dce3;

    font-size: 11px;
    font-weight: 600;
}

.medicacoes-resumo-item strong {
    display: block;

    margin-top: 9px;

    color: #ffffff;

    font-size: 30px;
    font-weight: 800;
}

/* =====================================================
   LISTA DE MEDICAÇÕES
===================================================== */

.medicacoes-lista {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

/* =====================================================
   CARTÃO DE PRESCRIÇÃO
===================================================== */

.medicacao-card {
    padding: 24px;

    background: #ffffff;

    border: 1px solid var(--border);
    border-radius: 10px;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;

    animation: aparecer 0.35s ease both;
}

.medicacao-card:hover {
    border-color: #c5dfdc;

    box-shadow:
        0 8px 23px rgba(25, 70, 85, 0.07);

    transform: translateY(-2px);
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =====================================================
   CABEÇALHO DA PRESCRIÇÃO
===================================================== */

.medicacao-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding-bottom: 18px;

    border-bottom: 1px solid #edf1f4;
}

.medicacao-card-header h3 {
    position: relative;

    padding-left: 15px;

    color: var(--primary);

    font-size: 16px;
    font-weight: 750;
}

.medicacao-card-header h3::before {
    content: "";

    position: absolute;

    left: 0;
    top: 3px;
    bottom: 3px;

    width: 4px;

    border-radius: 4px;

    background: var(--accent);
}

.medicacao-data {
    color: var(--text-secondary);

    font-size: 11px;
    font-weight: 600;

    white-space: nowrap;
}

/* =====================================================
   CAMPOS DA PRESCRIÇÃO
===================================================== */

.medicacao-campos {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 15px;

    padding-top: 20px;
}

.medicacao-campo {
    display: flex;
    flex-direction: column;

    gap: 7px;

    padding: 14px 15px;

    background: #f8fafb;

    border: 1px solid #edf1f4;
    border-radius: 7px;
}

.medicacao-label {
    color: #83939e;

    font-size: 10px;
    font-weight: 750;

    text-transform: uppercase;

    letter-spacing: 0.6px;
}

.medicacao-campo strong {
    color: #294555;

    font-size: 13px;
    font-weight: 700;

    line-height: 1.5;

    overflow-wrap: anywhere;
}

/* =====================================================
   ORIENTAÇÕES E OBSERVAÇÕES
===================================================== */

.medicacao-observacoes {
    margin-top: 18px;

    padding: 17px 19px;

    background: #f0f8f7;

    border-left: 3px solid var(--accent);

    border-radius: 5px;
}

.medicacao-observacoes strong {
    display: block;

    margin-bottom: 8px;

    color: #28796e;

    font-size: 11px;
    font-weight: 800;
}

.medicacao-observacoes p {
    color: #506c75;

    font-size: 12px;
    line-height: 1.7;

    overflow-wrap: anywhere;
}

/* =====================================================
   ESTADO VAZIO / CARREGAMENTO
===================================================== */

.estado-vazio {
    padding: 42px 20px;

    text-align: center;

    color: #8b9aa4;

    background: #f8fafb;

    border: 1px dashed #dbe4e9;
    border-radius: 9px;

    font-size: 13px;
    line-height: 1.7;
}

/* =====================================================
   MENSAGENS
===================================================== */

.admin-message {
    margin-top: 15px;

    color: var(--success);

    font-size: 12px;
    font-weight: 600;
}

.admin-message.error {
    padding: 12px 15px;

    color: #a43838;

    background: #fff0ef;

    border: 1px solid #f1ceca;
    border-radius: 6px;
}

/* =====================================================
   ROLAGEM
===================================================== */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #edf1f4;
}

::-webkit-scrollbar-thumb {
    background: #b8c9d0;

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #829da8;
}

/* =====================================================
   RESPONSIVIDADE - TABLETS
===================================================== */

@media (max-width: 850px) {

    .setor-header {
        padding: 0 25px;
    }

    .setor-container {
        padding: 38px 22px 55px;
    }

    .setor-card {
        padding: 25px;
    }

    .medicacoes-resumo-item {
        min-width: 200px;
    }
}

/* =====================================================
   RESPONSIVIDADE - CELULARES
===================================================== */

@media (max-width: 600px) {

    .setor-header {
        min-height: 75px;
        padding: 0 16px;
    }

    .setor-logo {
        width: 43px;
        height: 43px;

        font-size: 15px;
    }

    .setor-brand {
        gap: 11px;
    }

    .setor-brand h1 {
        font-size: 15px;
    }

    .setor-brand p {
        font-size: 10px;
    }

    .btn-sair {
        min-height: 36px;
        padding: 0 11px;

        font-size: 10px;
    }

    .setor-container {
        padding: 32px 15px 45px;
    }

    .setor-welcome {
        margin-bottom: 24px;
    }

    .setor-welcome h2 {
        font-size: 24px;
    }

    .setor-welcome p {
        font-size: 12px;
    }

    .setor-card {
        padding: 20px 15px;
    }

    .setor-section-header {
        align-items: flex-start;
        flex-direction: column;

        gap: 16px;
    }

    .setor-section-header h2 {
        font-size: 16px;
    }

    .btn-secondary {
        width: 100%;
    }

    .medicacoes-resumo {
        margin: 20px 0;
    }

    .medicacoes-resumo-item {
        width: 100%;
        min-width: 0;
    }

    .medicacao-card {
        padding: 18px 14px;
    }

    .medicacao-card-header {
        align-items: flex-start;
        flex-direction: column;

        gap: 10px;
    }

    .medicacao-card-header h3 {
        font-size: 14px;
    }

    .medicacao-data {
        font-size: 10px;
    }

    .medicacao-campos {
        grid-template-columns: 1fr;

        gap: 10px;

        padding-top: 15px;
    }

    .medicacao-campo {
        padding: 13px;
    }

    .medicacao-observacoes {
        padding: 14px;
    }
}

/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media (max-width: 350px) {

    .setor-brand h1 {
        font-size: 13px;
    }

    .btn-sair {
        padding: 0 8px;

        font-size: 9px;
    }

    .setor-welcome h2 {
        font-size: 21px;
    }

    .setor-card {
        padding: 15px 11px;
    }
}

    </style>
</head>

<body class="medicacoes-page">

    <header class="setor-header">
        <div class="setor-brand">
            <div class="setor-logo">VP</div>
            <div>
                <h1>Hospital Vida Plena</h1>
                <p>Controle de medicações</p>
            </div>
        </div>

        <a href="/index.html" class="btn-sair">Sair do sistema</a>
    </header>

    <main class="setor-container">

        <section class="setor-welcome">
            <span class="setor-tag">REGISTROS CLÍNICOS</span>
            <h2>Medicações prescritas</h2>
            <p>Consulte o histórico de medicamentos registrados nas consultas médicas.</p>
        </section>

        <section class="setor-card">

            <div class="setor-section-header">
                <div>
                    <h2>Histórico de prescrições</h2>
                    <p>Medicamentos prescritos no hospital.</p>
                </div>

                <button
                    type="button"
                    id="btnAtualizar"
                    class="btn-secondary"
                >
                    Atualizar
                </button>
            </div>

            <div class="medicacoes-resumo">
                <div class="medicacoes-resumo-item">
                    <span>Total de prescrições</span>
                    <strong id="totalPrescricoes">0</strong>
                </div>
            </div>

            <div class="medicacoes-lista" id="listaMedicacoes">
                <p class="estado-vazio">Carregando prescrições...</p>
            </div>

            <p id="mensagem" class="admin-message" role="status"></p>

        </section>

    </main>

    <script>
        const listaMedicacoes = document.getElementById("listaMedicacoes");
        const totalPrescricoes = document.getElementById("totalPrescricoes");
        const mensagem = document.getElementById("mensagem");

        function criarElemento(tag, texto, classe) {
            const elemento = document.createElement(tag);
            elemento.textContent = texto;

            if (classe) {
                elemento.className = classe;
            }

            return elemento;
        }

        function formatarData(data) {
            if (!data) return "Data não informada";

            const dataConvertida = new Date(data);

            if (Number.isNaN(dataConvertida.getTime())) {
                return String(data);
            }

            return dataConvertida.toLocaleString("pt-BR");
        }

        function criarCampo(rotulo, valor) {
            const grupo = document.createElement("div");
            grupo.className = "medicacao-campo";

            grupo.appendChild(
                criarElemento("span", rotulo, "medicacao-label")
            );

            grupo.appendChild(
                criarElemento("strong", valor || "Não informado")
            );

            return grupo;
        }

        async function carregarMedicacoes() {
            listaMedicacoes.replaceChildren(
                criarElemento(
                    "p",
                    "Carregando prescrições...",
                    "estado-vazio"
                )
            );

            mensagem.textContent = "";

            try {
                const resposta = await fetch("/medicacoes");

                if (!resposta.ok) {
                    throw new Error("Não foi possível carregar as prescrições.");
                }

                const dados = await resposta.json();

                const prescricoes = Array.isArray(dados) ? dados : [];

                totalPrescricoes.textContent = prescricoes.length;

                listaMedicacoes.replaceChildren();

                if (prescricoes.length === 0) {
                    listaMedicacoes.appendChild(
                        criarElemento(
                            "p",
                            "Nenhuma medicação prescrita até o momento.",
                            "estado-vazio"
                        )
                    );
                    return;
                }

                prescricoes.slice().reverse().forEach(prescricao => {
                    const card = document.createElement("article");
                    card.className = "medicacao-card";

                    const cabecalho = document.createElement("div");
                    cabecalho.className = "medicacao-card-header";

                    const titulo = criarElemento(
                        "h3",
                        prescricao.medicacao || "Medicamento não informado"
                    );

                    const data = criarElemento(
                        "span",
                        formatarData(prescricao.data),
                        "medicacao-data"
                    );

                    cabecalho.append(titulo, data);

                    const campos = document.createElement("div");
                    campos.className = "medicacao-campos";

                    campos.appendChild(
                        criarCampo(
                            "Paciente",
                            prescricao.paciente
                        )
                    );

                    campos.appendChild(
                        criarCampo(
                            "Diagnóstico",
                            prescricao.diagnostico
                        )
                    );

                    campos.appendChild(
                        criarCampo(
                            "Quantidade retirada",
                            prescricao.quantidadeRetirada != null
                                ? prescricao.quantidadeRetirada + " unidade(s)"
                                : "Não informado"
                        )
                    );

                    if (prescricao.unidade) {
                        campos.appendChild(
                            criarCampo("Unidade", prescricao.unidade)
                        );
                    }

                    card.appendChild(cabecalho);
                    card.appendChild(campos);

                    if (prescricao.obs) {
                        const observacoes = document.createElement("div");
                        observacoes.className = "medicacao-observacoes";

                        observacoes.appendChild(
                            criarElemento("strong", "Orientações e observações")
                        );

                        observacoes.appendChild(
                            criarElemento("p", prescricao.obs)
                        );

                        card.appendChild(observacoes);
                    }

                    listaMedicacoes.appendChild(card);
                });

            } catch (erro) {
                listaMedicacoes.replaceChildren(
                    criarElemento("p", erro.message, "estado-vazio")
                );

                mensagem.textContent = erro.message;
                mensagem.className = "admin-message error";
            }
        }

        document.getElementById("btnAtualizar").addEventListener(
            "click",
            carregarMedicacoes
        );

        carregarMedicacoes();
    </script>

</body>
</html>
